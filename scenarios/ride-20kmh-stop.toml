# The rider leans forward to 20 km/h, rides there for 10 s, then leans back and brakes to a stop.
# The firmware must carry the rider through it without a cutoff and keep the pedals near level.
schema = 1
name = "ride-20kmh-stop"
description = "Lean to 20 km/h, hold it for 10 s, brake to a stop."
wheel = "begode-extreme"
seconds = 40.0
release_s = 2.5
# [s, km/h]: stand still, about 1.1 m/s² up to 20 km/h, hold, about 1.4 m/s² down to a stop.
speed_kmh = [[0, 0], [6, 0], [11, 20], [21, 20], [25, 0]]
# Factory settings with level pedals (a blank journal would tilt them 4.8° nose down).
settings = "neutral"

# City world (docs/models/world.md): seed 42, from the spawn on the arterial (row 0) heading east,
# on a straight line that stays within 2 m of the centreline, in the carriageway's level middle.
# Ideal road (hills = 0, no potholes, manholes, cracks, rough or wet patches): this run tests the
# firmware and the rider, not the road. Lane and crosswalk paint stays on the line.
[world]
seed = 42
revision = 2

[world.densities]
hills = 0.0
potholes = 0.0
manholes = 0.0
cracks = 0.0
rough_patches = 0.0
wet_patches = 0.0

[[expect]]
check = "upright"

[[expect]]
check = "no_cutoff"

[[expect]]
check = "pitch"
max_abs_deg = 10.0

[[expect]]
check = "speed_reached"
kmh = 19.0

[[expect]]
check = "stopped_at_end"
max_abs_kmh = 1.0
