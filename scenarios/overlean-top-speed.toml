# Overlean: the rider keeps accelerating (5 km/h per second, towards 100 km/h) past what the motor
# can give, on the maintainer's settings (current-mode drive, hard pedals, speed tiltback 69 km/h,
# PWM alarm 80 % with PWM tiltback). As speed grows, the back-EMF and the winding's reactance eat
# the voltage headroom; when the q-current loop saturates (PWM 100 %) the motor can no longer push
# the wheel ahead of the rider and the wheel nose-dives: the classic cutout.
#
# The `record` checks always pass: they note when each warning came and what the wheel was doing
# when it fell. `upright` is the safety verdict: it fails on the stock firmware. The speed where
# it happens depends on the motor's inductance and flux, which are defaults until measured
# (docs/models/electrical.md), and when it happens on the pedal height (an estimate, ±15 mm);
# docs/models/scenarios.md has the numbers.
schema = 1
name = "overlean-top-speed"
description = "Accelerate past the motor's limit on a full battery: when do the warnings come, and does the stock firmware hold?"
wheel = "begode-extreme"
seconds = 40.0
release_s = 2.5
speed_kmh = [[0, 0], [6, 0], [26, 100]]
settings = "tarik-2026-10-15"

# City world (docs/models/world.md): seed 42, from the spawn on the arterial (row 0) heading east,
# on a straight line that stays within 2 m of the centreline, in the carriageway's level middle.
# Ideal road (hills = 0, no potholes, manholes, cracks, rough or wet patches): this run tests the
# firmware and the rider, not the road. Lane and crosswalk paint stays on the line.
[world]
seed = 42
revision = 2

[world.densities]
hills = 0.0
potholes = 0.0
manholes = 0.0
cracks = 0.0
rough_patches = 0.0
wet_patches = 0.0

# The overleaning rider ignores the tiltback and keeps leaning: that is the danger this run shows.
# With the rear suspension, a rider who leans at most 15° (the default) ends at the edge: the speed
# and PWM tiltbacks hold the stock wheel near 71 km/h, and the outcome changes with the emulator's
# timing. This rider leans up to 18°, as a rider who pushes harder at speed, and reaches the cutout.
# Pinned to the rigid baseline (model = "rigid_ankle_v1"): the cutout this run shows, and its
# numbers in docs/models/scenarios.md, come from that rider. Known limitation of the default
# articulated rider: with the same lean its drive torque is smoother and keeps the PWM out of saturation;
# on stock its PWM alarm comes at 26.4 s, its PWM stays below 100 %, the speed and PWM tiltbacks
# hold the wheel near 75 km/h, and it does not cut out (2026-10-22, all three quanta).
[rider]
model = "rigid_ankle_v1"

[rider.control]
tiltback_feel_deg = 90.0      # never eases off, whatever the tiltback
lean_max_deg = 18.0           # leans harder than the default 15°

[[expect]]
check = "record"
var = "vq_active"
scale = 0.0031746     # 1/315: the app's PWM %
stat = "first_above"
threshold = 80.0

[[expect]]
check = "record"
var = "pwm_alarm"
stat = "first_above"
threshold = 1.0

[[expect]]
check = "record"
var = "vq_active"
scale = 0.0031746     # PWM saturated: the q-current loop has no headroom left
stat = "first_above"
threshold = 100.0

[[expect]]
check = "record"
signal = "speed_kmh"
stat = "at_cutoff"

[[expect]]
check = "record"
var = "tiltback_pwm_deg"
stat = "at_fall"

[[expect]]
check = "record"
signal = "battery_v"
stat = "at_fall"

[[expect]]
check = "record"
signal = "iq_a"
stat = "at_fall"

[[expect]]
check = "record"
var = "balance_disabled"
stat = "first_above"
threshold = 1.0

[[expect]]
check = "upright"
