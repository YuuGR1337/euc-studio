# Overlean on a 30 % battery (115 V at rest instead of 130 V): the same rider and settings as
# overlean-top-speed.toml, so the comparison shows how much earlier the cutout comes with less
# voltage headroom. See that file for what the checks mean.
schema = 1
name = "overlean-top-speed-30pct"
description = "Accelerate past the motor's limit on a 30 % battery: the cutout comes earlier."
wheel = "begode-extreme"
seconds = 32.0
release_s = 2.5
speed_kmh = [[0, 0], [6, 0], [26, 100]]
settings = "tarik-2026-10-15"

# The overleaning rider ignores the tiltback and keeps leaning: that is the danger this run shows.
# Pinned to the rigid baseline (model = "rigid_ankle_v1"): the cutout this run shows, and its
# numbers in docs/models/scenarios.md, come from that rider. Known limitation of the default
# articulated rider: with the same lean its drive torque is smoother and keeps the PWM out of saturation;
# on stock its PWM alarm comes at 23.7 s, the PWM stays below 100 % and the wheel stays up
# (2026-10-22, all three quanta).
[rider]
model = "rigid_ankle_v1"

[rider.control]
tiltback_feel_deg = 90.0      # never eases off, whatever the tiltback

[[timeline]]
at_s = 0.0
fault = "battery_soc"
soc = 0.30

[[expect]]
check = "record"
var = "vq_active"
scale = 0.0031746     # 1/315: the app's PWM %
stat = "first_above"
threshold = 80.0

[[expect]]
check = "record"
var = "pwm_alarm"
stat = "first_above"
threshold = 1.0

[[expect]]
check = "record"
var = "vq_active"
scale = 0.0031746     # PWM saturated: the q-current loop has no headroom left
stat = "first_above"
threshold = 100.0

[[expect]]
check = "record"
signal = "speed_kmh"
stat = "at_cutoff"

[[expect]]
check = "record"
var = "tiltback_pwm_deg"
stat = "at_fall"

[[expect]]
check = "record"
signal = "battery_v"
stat = "at_fall"

[[expect]]
check = "record"
signal = "iq_a"
stat = "at_fall"

[[expect]]
check = "record"
var = "balance_disabled"
stat = "first_above"
threshold = 1.0

[[expect]]
check = "upright"
