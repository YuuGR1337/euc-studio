# PRELIMINARY: the rear suspension is modelled (measured spring; stroke and linkage ratio are
# estimates), but the rider has no knees and the tire is a soft contact. Do not tune this run to pass.
#
# pothole-20kmh with a deeper city pothole, 4.9 cm deep and 0.60 m across: the speed dips from 20.1 to
# 15.6 km/h, the suspension bottoms (68 mm), Iq reaches 247 A, and the shell pitches 5.1° nose down
# at up to about 110 °/s (1 kHz samples), inside the stock gyro's ±500 °/s (stock, all three quanta;
# docs/models/scenarios.md, "City world (W2)"). On the current body model the dip no longer passes
# 40° and the gyro does not clip, on the flat floor either (3.8°, 88 °/s before W2): finding 7 in
# docs/findings/stock-firmware.md (a dip to about -42°, past the gyro's range, and clean's
# GYRO_500DPS_CLIP and ERROR_CUTOFF_22MS answers to it) comes from an earlier model and is to be
# measured again. firmware/docs/cutoffs.md has the cut-off rules.
#
# The outcome is decided by the mechanics within 0.1 s, faster than the firmware's balance loop can
# change much, and it depends on the body model. The `record` checks always pass; `upright` and
# `no_cutoff` are the safety verdict.
schema = 1
name = "pothole-5cm-20kmh"
description = "Hit a 5 cm deep pothole at 20 km/h: a dip past 40° that the balance recovers, and whether a cut-off ends the ride."
wheel = "begode-extreme"
seconds = 23.0
release_s = 2.5
speed_kmh = [[0, 0], [6, 0], [11, 20]]
settings = "tarik-2026-10-15"
# Rider: the default rider (it eases off when the pedals tip back).

# City world (docs/models/world.md): seed 42, a real pothole on a local street, 4.9 cm deep and
# 0.60 m across, at (-28.33, 214.60), reached after 50 m heading north on a level, straight
# approach with nothing else on it. Level city (hills = 0) with manholes, cracks, rough and wet
# patches off so the approach stays clean; potholes keep their density (this one is among them).
[world]
seed = 42
revision = 2
start = { x_m = -28.33, y_m = 164.6, heading_deg = 90.0 }

[world.densities]
hills = 0.0
manholes = 0.0
cracks = 0.0
rough_patches = 0.0
wet_patches = 0.0

[[expect]]
check = "record"
signal = "distance_m"
stat = "first_above"
threshold = 50.0

[[expect]]
check = "record"
signal = "speed_kmh"
stat = "min"
from_s = 15.0
by_s = 19.9

[[expect]]
check = "record"
signal = "pitch_deg"
stat = "min"
from_s = 15.0

[[expect]]
check = "record"
signal = "iq_a"
stat = "max"
from_s = 15.0

# The firmware's attitude against the true pitch after the dip: stock and compat lose the gyro's excess
# and stay a few degrees off; clean follows within about 1° (the bound only records).
[[expect]]
check = "firmware_tracks"
var = "attitude_pitch_deg"
scale = -1.0          # the firmware's pitch is positive nose down
signal = "pitch_deg"
max_rms = 45.0
from_s = 20.8
by_s = 22.0

# How deep the firmware believes the dip is (positive nose down): past 40° the cut-off detectors count.
[[expect]]
check = "record"
var = "attitude_pitch_deg"
stat = "max"
from_s = 19.5
by_s = 20.5

[[expect]]
check = "upright"

[[expect]]
check = "speed_reached"
kmh = 19.0           # reject a run that limps before the intended 20 km/h approach

[[expect]]
check = "no_cutoff"

[[expect]]
check = "record"
signal = "suspension_mm"     # axle travel used (the bottom-out follows from plant.toml's stroke and linkage)
stat = "max"
from_s = 15.0
