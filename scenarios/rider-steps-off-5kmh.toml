# The rider steps off at 5 km/h: the feet leave the pedals, the body lands beside the wheel, and
# the stepping foot gives the shell a short sideways push. The wheel goes on alone, light and with
# nothing to hold it upright laterally. A regression guard for the cut-offs (firmware/docs/cutoffs.md,
# "Acceptance: what must still cut"): every profile, stock, compat and clean, must cut once the wheel
# goes down, and the wheel must not run away (it ends standing still).
#
# What the run shows (2026-10-16): the riderless wheel is easy to balance, so all three profiles keep
# driving it until it tips onto its side; the roll cut-off then disables the drive. The cut therefore
# follows the tip-over, not the step-off: `cutoff` allows 3 s after the step-off, and the `record`
# checks give the time the roll passed 40° (whichever side) so the delay from tip-over to cut can be
# read off.
#
# Rider: the default rider, on the maintainer's settings, until it steps off at 12 s.
schema = 1
name = "rider-steps-off-5kmh"
description = "The rider steps off at 5 km/h: every profile must cut once the wheel goes down, and the wheel must not run away."
wheel = "begode-extreme"
seconds = 18.0
release_s = 2.5
speed_kmh = [[0, 0], [6, 0], [8, 5]]
settings = "tarik-2026-10-15"
step_off_s = 12.0

# City world (docs/models/world.md): seed 42, from the spawn on the arterial (row 0) heading east,
# on a straight line that stays within 2 m of the centreline, in the carriageway's level middle.
# Ideal road (hills = 0, no potholes, manholes, cracks, rough or wet patches): this run tests the
# firmware and the rider, not the road. Lane and crosswalk paint stays on the line.
[world]
seed = 42
revision = 2

[world.densities]
hills = 0.0
potholes = 0.0
manholes = 0.0
cracks = 0.0
rough_patches = 0.0
wet_patches = 0.0

[[expect]]
check = "cutoff"
from_s = 12.0
within_s = 3.0
flag = "balance_disabled"

[[expect]]
check = "record"
signal = "roll_deg"
stat = "first_above"
threshold = 40.0
from_s = 12.0

[[expect]]
check = "record"
signal = "roll_deg"
stat = "first_below"
threshold = -40.0
from_s = 12.0

[[expect]]
check = "record"
signal = "speed_kmh"
stat = "at_cutoff"
from_s = 12.0

[[expect]]
check = "record"
signal = "torque_nm"
stat = "max"
from_s = 12.0

[[expect]]
check = "stopped_at_end"
max_abs_kmh = 1.0
