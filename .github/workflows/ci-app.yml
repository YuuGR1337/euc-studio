name: app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci-app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/ci-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      - name: Design tokens in sync (tokens.ts -> tokens.css)
        run: pnpm tokens:check

      - name: Contrast (every declared pair, WCAG AA)
        run: pnpm contrast

      - run: pnpm test
      - run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright (shell, workspaces, gallery screenshots)
        run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-screenshots
          path: |
            app/test-results/
            app/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  tauri:
    name: Tauri check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Linux system libraries (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check --locked --all-targets
