[workspace]
members = ["crates/*"]
# The Tauri app has its own workspace until the engine crates it embeds settle.
exclude = ["app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/tarikbc/euc-studio"
publish = false

[workspace.dependencies]
euc-core = { path = "crates/euc-core" }
euc-fwsource = { path = "crates/euc-fwsource" }
euc-image = { path = "crates/euc-image" }
euc-profile = { path = "crates/euc-profile" }

anstream = "1.0"
anstyle = "1.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
crc32fast = "1.5"
directories = "6.0"
hex = "0.4"
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
# rustls with the bundled Mozilla roots: the same trust store on every OS, no OpenSSL.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
missing_docs = "warn"
# Emulator crates may need unsafe for FFI or hot paths; they opt in locally with a comment that says why.
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Register and bus code narrows integers on purpose; these lints would flag nearly every line.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
