[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "euc-studio"
version = "0.1.0"
description = "Native access to the EUC Studio firmware simulator"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
]

[tool.maturin]
manifest-path = "../crates/euc-python/Cargo.toml"
python-source = "."
module-name = "euc_studio._native"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# The Rust profile crate embeds these reviewed TOML files at compile time.
include = [
    { path = "profiles/begode-extreme/*.toml", format = "sdist" },
    # Cargo metadata needs this optional local dependency, even without its feature.
    { path = "crates/euc-unicorn/Cargo.toml", format = "sdist" },
    { path = "crates/euc-unicorn/src/*.rs", format = "sdist" },
]
# Local override profiles, captures, firmware, and libraries never become package data.
exclude = ["**/__pycache__/**", "**/*.pyc", ".venv/**"]
