<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- EUC Studio app icon: the wheel mark on a dark tile (macOS grid: 824 px body, 100 px margin). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2C2E"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="512" y1="262" x2="512" y2="762">
      <stop offset="0" stop-color="#FF9A4D"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <g fill="none" stroke="url(#rim)" stroke-linecap="round">
    <circle cx="512" cy="512" r="250" stroke-width="64"/>
    <circle cx="512" cy="512" r="88" stroke-width="56"/>
    <path d="M512 262v150" stroke-width="64"/>
  </g>
</svg>
