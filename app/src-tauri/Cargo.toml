[package]
name = "euc-studio-app"
version = "0.1.0"
description = "EUC Studio: run electric unicycle firmware in a 3D simulation"
authors = ["Tarik Caramanico"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/tarikbc/euc-studio"
edition = "2024"
rust-version = "1.99"
publish = false

# The app is its own cargo workspace and uses the engine crates by path: the engine workspace's CI
# never needs the web view's system libraries, and the app pins its own Tauri versions.
[workspace]

[lib]
name = "euc_studio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The Unicorn CPU backend: GPL-2.0, for development only. `pnpm tauri dev` turns it on
# (scripts/tauri.mjs) and `EUC_CPU=unicorn` selects it; our own core runs otherwise. A bundle
# refuses to compile with it (see src/engine/cpu.rs).
unicorn = ["euc-sim/unicorn"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# "Open recording…": the system's open panel.
tauri-plugin-dialog = "2"
# Where "Record this run" saves (Documents/EUC Studio/Recordings).
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

euc-physics = { path = "../../crates/euc-physics" }
euc-core = { path = "../../crates/euc-core" }
euc-devices = { path = "../../crates/euc-devices" }
euc-display = { path = "../../crates/euc-display" }
euc-fwsource = { path = "../../crates/euc-fwsource" }
euc-image = { path = "../../crates/euc-image" }
euc-profile = { path = "../../crates/euc-profile" }
euc-proto-begode = { path = "../../crates/euc-proto-begode" }
euc-sim = { path = "../../crates/euc-sim" }
euc-stm32f1 = { path = "../../crates/euc-stm32f1" }
euc-telemetry = { path = "../../crates/euc-telemetry" }
euc-world = { path = "../../crates/euc-world" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The emulator is too slow to ride in real time unoptimized; keep dev builds of the engine fast.
[profile.dev.package."*"]
opt-level = 3
