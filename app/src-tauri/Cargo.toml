[package]
name = "euc-studio-app"
version = "0.1.0"
description = "EUC Studio: run electric unicycle firmware in a 3D simulation"
authors = ["Tarik Caramanico"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/tarikbc/euc-studio"
edition = "2021"
rust-version = "1.85"
publish = false

# The app is its own cargo workspace; the engine workspace at the repo root excludes app/src-tauri.
[workspace]

[lib]
name = "euc_studio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
